<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Agencia de Viajes - Inicio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Agencia de Viajes</h1>
    <nav id="menu"></nav>
  </header>

  <main>
    <section class="hero">
      <h2>Encuentra tu próximo destino</h2>
      <p>Busca hoteles por destino y reserva fácilmente.</p>
    </section>

    <section>
      <h3>Hoteles</h3>
      <div id="hotelesList" class="grid"></div>
    </section>
  </main>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      renderMenu();
      const cont = document.getElementById("hotelesList");
      cont.innerHTML = "Cargando...";

      try {
        const hoteles = await fetchHoteles();
        if (!hoteles || hoteles.length === 0) {
          cont.innerHTML = "<p>No hay hoteles disponibles.</p>";
          return;
        }

        cont.innerHTML = hoteles.map(h => `
          <div class="card">
            <h4>${h.NombreHotel}</h4>
            <p>${h.Ubicacion}</p>
            <div class="card-actions">
              <a class="btn" href="habitaciones.html?q=${encryptUrlData({ hotelId: h.IdHotel })}">Ver habitaciones</a>
            </div>
          </div>
        `).join("");
      } catch (err) {
        cont.innerHTML = "<p>Error cargando hoteles.</p>";
        console.error(err);
      }
    });
  </script>
</body>
</html>
