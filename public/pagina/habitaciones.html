<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Habitaciones</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a href="index.html" class="btn-home">← Volver al inicio</a>
        <h1>Habitaciones</h1>
        <nav id="menu"></nav>
    </header>

    <main>
        <div id="habitacionesContainer" class="cards"></div>
        <p id="msg" style="font-weight: bold;"></p>
    </main>

    <script src="api.js"></script>
    <script src="auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            renderMenu();

            //Encriptacion del ID del hotel
            const q = new URLSearchParams(location.search).get("q");
            const urlData = decryptUrlData(q) || {};
            const hotelId = urlData.hotelId;
            const container = document.getElementById("habitacionesContainer");

            if (!hotelId) {
                container.innerHTML = "<p>Hotel no especificado.</p>";
                return;
            }

            try {
                const habitaciones = await fetch(`/api/habitaciones`).then(r => r.json());
                const filtradas = habitaciones.filter(h => h.IdHotel == hotelId);

                if (filtradas.length === 0) {
                    container.innerHTML = "<p>No hay habitaciones disponibles en este hotel.</p>";
                    return;
                }

                container.innerHTML = filtradas.map(h => {

                    const disp = h.HabitacionesTotales;

                    let color = "gray";
                    if (disp >= 5) color = "green";
                    else if (disp >= 3) color = "gold";
                    else if (disp >= 1) color = "red";

                    const boton = disp > 0
                        ? `<a class="btn" href="reservar.html?q=${encryptUrlData({ hotelId: hotelId, habitacionId: h.IdHabitacion })}">Reservar</a>`
                        : `<button class="btn-disabled" disabled>No disponible</button>`;

                    return `
        <div class="card">
          <h3>${h.TipoHabitacion}</h3>
          <p><strong>Precio:</strong> $${h.Precio} / noche</p>
          <p><strong>Máximo:</strong> ${h.MaximoHuespedes} huéspedes por habitación</p>


          <div class="barra-stock">
            <div class="stock" style="width:${Math.min(disp * 15, 100)}%; background:${color};"></div>
          </div>
          <p><strong>Disponibles:</strong> ${disp}</p>

          ${boton}
        </div>`;
                }).join("");

            } catch (err) {
                console.error(err);
                container.innerHTML = "<p>Error cargando habitaciones.</p>";
            }
        });
    </script>

    <style>
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 20px;
            margin: 20px;
        }

        .card {
            border: 2px solid #0077cc;
            padding: 15px;
            border-radius: 12px;
            background: #eef7ff;
        }

        .card h3 {
            color: #0059a3;
        }

        .barra-stock {
            background: #ccc;
            height: 12px;
            border-radius: 6px;
            margin: 6px 0;
        }

        .stock {
            height: 100%;
            border-radius: 6px;
            transition: width 0.4s ease;
        }

        .btn {
            background: #0077cc;
            color: #fff;
            padding: 10px;
            text-decoration: none;
            border-radius: 6px;
            display: inline-block;
            margin-top: 10px;
        }

        .btn:hover {
            background: #005fa3;
        }

        .btn-disabled {
            background: #777;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 10px;
            cursor: not-allowed;
        }
    </style>

</body>

</html>
