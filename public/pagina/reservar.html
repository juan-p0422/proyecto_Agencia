<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reservar Habitación</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a href="index.html" class="btn-home">← Volver al inicio</a>
  <h1>Reservar Habitación</h1>
  <nav id="menu"></nav>
</header>

<main>
  <section>
    <h2 id="titulo">Cargando habitación...</h2>

    <p id="disponibles" style="font-weight:bold;"></p>

    <form id="reservarForm">
      <label>Fecha inicio:</label>
      <input type="date" id="fechaInicio" required>

      <label>Fecha fin:</label>
      <input type="date" id="fechaFin" required>

      <label>Huéspedes:</label>
      <input type="number" id="numHuespedes" value="1" min="1" required>

      <label>Número de habitaciones:</label>
      <input type="number" id="numHabitaciones" value="1" min="1" required>

      <label>Transporte:</label>
      <select id="transporteSelect"></select>

      <p id="precioPreview" style="font-weight: bold;">Precio estimado: $0</p>

      <button type="submit">Confirmar Reserva</button>
    </form>

    <p id="msg" style="margin-top: 20px; font-weight:bold;"></p>
  </section>
</main>

<script src="api.js"></script>
<script src="auth.js"></script>

<script>
function getQueryParam(name) {
  return new URLSearchParams(location.search).get(name);
}

function daysBetween(start, end) {
  const ms = new Date(end) - new Date(start);
  return Math.max(Math.ceil(ms / 86400000), 1);
}

document.addEventListener("DOMContentLoaded", async () => {
  renderMenu();

  const habitacionId = getQueryParam("habitacionId");
  const hotelId = getQueryParam("hotelId");

  const titulo = document.getElementById("titulo");
  const disp = document.getElementById("disponibles");
  const transporteSelect = document.getElementById("transporteSelect");
  const precioPreview = document.getElementById("precioPreview");
  const msg = document.getElementById("msg");
  const form = document.getElementById("reservarForm");
  const numHuespedes = document.getElementById("numHuespedes");
  const numHabitaciones = document.getElementById("numHabitaciones");

  if (!habitacionId || !hotelId) {
    titulo.textContent = "Habitación no especificada.";
    return;
  }

  try {
    const habitaciones = await fetchHabitaciones();
    const habit = habitaciones.find(h => String(h.IdHabitacion) === habitacionId);

    if (!habit) {
      titulo.textContent = "Habitación no encontrada.";
      return;
    }

    titulo.textContent = `${habit.TipoHabitacion} — $${habit.Precio}/noche`;
    disp.textContent = `Disponibles: ${habit.HabitacionesTotales}`;

    if (habit.HabitacionesTotales === 0) {
      msg.textContent = "No hay habitaciones disponibles.";
      form.style.display = "none";
      return;
    }

    const transportes = await fetchTransportes();
    transporteSelect.innerHTML = transportes.map(t => `
      <option value="${t.IdTransporte}" data-price="${t.PrecioPorPersona}">
        ${t.TipoTransporte} (${t.NombreEmpresa}) - $${t.PrecioPorPersona}
      </option>
    `).join("");

    function actualizarMaximos() {
      const nh = Number(numHabitaciones.value);
      const maxHues = habit.MaximoHuespedes * nh;
      numHuespedes.max = maxHues;
    }

    function actualizarPrecio() {
      const fi = fechaInicio.value;
      const ff = fechaFin.value;
      let nh = Number(numHabitaciones.value);
      let nhues = Number(numHuespedes.value);
      const transpPrice = Number(transporteSelect.selectedOptions[0].dataset.price);

      if (!fi || !ff) return;

      if (nh > habit.HabitacionesTotales) {
        alert(`Solo hay ${habit.HabitacionesTotales} habitaciones disponibles.`);
        numHabitaciones.value = habit.HabitacionesTotales;
        nh = habit.HabitacionesTotales;
      }

      const maxPermitidos = habit.MaximoHuespedes * nh;
      if (nhues > maxPermitidos) {
        alert(`Máximo ${maxPermitidos} huésped(es) permitidos para ${nh} habitación(es).`);
        numHuespedes.value = maxPermitidos;
        nhues = maxPermitidos;
      }

      const dias = daysBetween(fi, ff);
      const total = habit.Precio * dias * nh + transpPrice;
      precioPreview.textContent = `Precio estimado: $${total}`;
    }

    numHabitaciones.addEventListener("input", () => {
      actualizarMaximos();
      actualizarPrecio();
    });
    numHuespedes.addEventListener("input", actualizarPrecio);
    fechaInicio.addEventListener("change", actualizarPrecio);
    fechaFin.addEventListener("change", actualizarPrecio);
    transporteSelect.addEventListener("change", actualizarPrecio);

    actualizarMaximos();
    actualizarPrecio();

    form.addEventListener("submit", async e => {
      e.preventDefault();

      const usuario = getCurrentUser();
      if (!usuario) {
        alert("Debes iniciar sesión para reservar.");
        location.href = "login.html";
        return;
      }

      const nh = Number(numHabitaciones.value);
      const nhues = Number(numHuespedes.value);
      const maxPermitidos = habit.MaximoHuespedes * nh;

      if (nhues > maxPermitidos) {
        alert(`Solo se permiten ${maxPermitidos} huésped(es) para ${nh} habitación(es).`);
        return;
      }

      msg.textContent = "Creando reservación...";

      const body = {
        FechaInicio: fechaInicio.value,
        FechaFin: fechaFin.value,
        PrecioTotal: Number(precioPreview.textContent.replace(/\D/g, "")),
        NumHuespedes: nhues,
        NumHabitaciones: nh,
        IdHotel: Number(hotelId),
        IdTransporte: Number(transporteSelect.value),
        IdHabitacion: Number(habitacionId),
        Estatus: "Activa"
      };

      const res = await fetch(`${API_URL}reservaciones`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      const data = await res.json();

      if (res.status === 409) {
        msg.textContent = "No hay suficientes habitaciones disponibles.";
        return;
      }

      if (!res.ok) {
        msg.textContent = "Error al crear reservación.";
        console.error(data);
        return;
      }

      msg.textContent = "Reservación creada exitosamente. Asociando usuario...";

      await attachUsuarioToReservacion(data.IdReservacion, usuario.IdUsuario);

      setTimeout(() => {
        location.href = "perfil.html";
      }, 1200);

    });

  } catch (err) {
    console.error(err);
    titulo.textContent = "Error cargando datos.";
  }
});
</script>

<style>
.btn-home {
  display: inline-block;
  background: #005fa3;
  color: white;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: bold;
  text-decoration: none;
  margin-top: 10px;
}
.btn-home:hover {
  background: #003d80;
}
</style>

</body>
</html>
