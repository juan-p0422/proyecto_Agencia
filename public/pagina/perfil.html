<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi Perfil</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a href="index.html" class="btn-home">← Volver al inicio</a>
        <h1>Mi Perfil</h1>
        <nav id="menu"></nav>
    </header>

    <main class="centered" style="max-width: 900px;">
        <h2>Mis Reservaciones</h2>
        <div id="reservas"></div>
        <p id="msg" style="font-weight:bold; color:darkred;"></p>
    </main>

    <script src="api.js"></script>
    <script src="auth.js"></script>

    <script>
        // Llama al backend para obtener TODAS las reservaciones
        async function fetchReservaciones() {
            const res = await fetch(`${API_URL}reservaciones`);
            return await res.json();
        }

        // Cancelar una reservación
        async function cancelarReserva(id) {
            if (!confirm("¿Seguro que deseas cancelar esta reservación?")) return;

            const res = await fetch(`${API_URL}reservaciones/${id}/cancelar`, {
                method: "PATCH"
            });

            if (!res.ok) {
                alert("No se pudo cancelar la reservación");
                return;
            }

            alert("Reservación cancelada");
            location.reload(); // refrescar lista
        }

        document.addEventListener("DOMContentLoaded", async () => {
            renderMenu();

            const usuario = getCurrentUser();
            const reservasContainer = document.getElementById("reservas");
            const msg = document.getElementById("msg");

            if (!usuario) {
                msg.textContent = "Debes iniciar sesión para ver tus reservaciones.";
                return;
            }

            try {
                const reservas = await fetchReservaciones();

                // Filtrar por el usuario actual ↴
                const misReservas = reservas.filter(r =>
                    r.usuarios.some(u => u.IdUsuario === usuario.IdUsuario)
                );

                if (misReservas.length === 0) {
                    reservasContainer.innerHTML = "<p>No tienes reservaciones aún.</p>";
                    return;
                }

                reservasContainer.innerHTML = misReservas.map(r => {

                    const habitacion = r.habitacion ?? {};
                    const hotel = r.hotel ?? {};
                    const transporte = r.transporte ?? {};
                    const fechaInicio = r.FechaInicio.split("T")[0];
                    const fechaFin = r.FechaFin.split("T")[0];

                    const botonCancelar =
                        r.Estatus === "Cancelada"
                            ? `<button disabled>Cancelada</button>`
                            : `<button onclick="cancelarReserva(${r.IdReservacion})">Cancelar</button>`;

                    return `
        <div class="reserva-card">
          <h3>Hotel ${hotel.NombreHotel ?? ""}</h3>
          <p><strong>Habitación:</strong> ${habitacion.TipoHabitacion ?? "N/A"}</p>
          <p><strong>Fechas:</strong> ${fechaInicio} → ${fechaFin}</p>
          <p><strong>No. Habitaciones:</strong> ${r.NumHabitaciones}</p>
          <p><strong>Precio Total:</strong> $${r.PrecioTotal}</p>
          <p><strong>Estatus:</strong> ${r.Estatus}</p>
          <p><strong>Transporte:</strong> ${transporte.TipoTransporte ?? "N/A"}</p>
          ${botonCancelar}
        </div>
      `;
                }).join("");

            } catch (error) {
                console.error(error);
                msg.textContent = "Error cargando reservaciones.";
            }
        });
    </script>

    <style>
        /* Mejor estética básica */
        .reserva-card {
            border: 2px solid #0066cc;
            padding: 15px;
            margin: 15px 0;
            border-radius: 12px;
            background-color: #f8fbff;
        }

        .reserva-card h3 {
            color: #003d80;
        }

        .reserva-card button {
            background-color: #d9534f;
            border: none;
            padding: 8px 14px;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
        }

        .reserva-card button:disabled {
            background-color: #666;
            cursor: not-allowed;
        }
    </style>

</body>

</html>
