# ============================================
# Fail2ban Jail - Laravel Login
# ============================================

[DEFAULT]
bantime  = 3600
findtime = 300
maxretry = 5
backend  = polling

[laravel-login]
enabled  = true
filter   = laravel-login
logpath  = /var/log/laravel/laravel.log
port     = 8000,80,443
maxretry = 5
findtime = 300
bantime  = 3600
action   = iptables-multiport[name=laravel-login, port="8000,80,443", protocol=tcp]
